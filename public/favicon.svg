<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Light Mode Gradient -->
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072B2" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0072B2" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Dark Mode Gradient -->
    <linearGradient id="curve-grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56B4E9" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#56B4E9" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <style>
    .bg-area {
      fill: url(#curve-grad);
    }
    .stroke-line {
      stroke: #0072B2;
      stroke-width: 10;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
    .axis {
      stroke: #18181B;
      stroke-width: 8;
      stroke-linecap: round;
      opacity: 0.8;
    }
    @media (prefers-color-scheme: dark) {
      .bg-area {
        fill: url(#curve-grad-dark);
      }
      .stroke-line {
        stroke: #56B4E9;
      }
      .axis {
        stroke: #E8E8E6;
        opacity: 0.9;
      }
    }
  </style>

  <!-- Area under the curve -->
  <path class="bg-area" d="M 12 108 C 40 108 48 20 64 20 C 80 20 88 108 116 108 Z" />

  <!-- Axis line -->
  <line class="axis" x1="10" y1="108" x2="118" y2="108" />

  <!-- Bell Curve Line -->
  <path class="stroke-line" d="M 12 108 C 40 108 48 20 64 20 C 80 20 88 108 116 108" />
</svg>
